[package]
name = "mist"
version = "0.1.0"
edition = "2024"
authors = ["lonerOrz"]
description = "Fast, minimal Windows launcher"

[dependencies]
evalexpr = "12.0"
pinyin = "0.10"

[dependencies.windows]
version = "0.58"
features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
]

[profile.release]
opt-level = "z"      # 开启针对体积的极致优化
lto = true           # 开启全局链接时优化
codegen-units = 1    # 单个生成单元，最大化优化力度
panic = "abort"      # 剥离 panic 展开表和落地代码
strip = true         # 自动剔除所有调试符号与元数据
