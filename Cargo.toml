[package]
name = "mist"
version = "0.1.0"
edition = "2024"
authors = ["lonerOrz"]
description = "Fast, minimal Windows launcher"

[dependencies]
evalexpr = "13.1"
pinyin = "0.11"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
windows-numerics = "0.3"
notify = "8.2"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
]

[profile.release]
opt-level = "z"      # Aggressive size optimization
lto = true           # Whole-program link-time optimization
codegen-units = 1    # Single codegen unit for maximum optimization
panic = "abort"      # Drop unwind tables and landing pads
strip = true         # Strip debug symbols and metadata
